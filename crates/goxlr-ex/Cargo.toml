[package]
name = "goxlr-ex"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "GoXLR EX — interface Windows native Rust (egui/eframe), fusionnée depuis goxlr-ui/native-rust"

[[bin]]
name = "GoXLR-EX"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"
ureq = { version = "=2.12.1", default-features = false, features = ["json"] }
goxlr-ipc = { path = "../../vendor/goxlr-ipc" }
