[package]
name = "goxlr-types"
version = "1.2.4"
edition = "2024"
license = "MIT"
description = "Types IPC GoXLR, vendored depuis GoXLR-on-Linux/GoXLR-Utility (.portable-build/types) pour la fusion goxlr-ui"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
strum = { version = "0.27.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
enum-map = { version = "2.7.3", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"], optional = true }
serde_repr = "0.1.20"
derivative = "2.2.0"
